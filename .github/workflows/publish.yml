# Refreshes the data and publishes the static scanner to GitHub Pages.
# The custom domain is set in the repository's Pages settings.
name: Publish scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13,17,21 * * 1-5" # UTC, weekdays

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r backend/requirements-snapshot.txt
      - run: python backend/tests/test_logic.py
      # Fails (keeping the published version) if too many tickers are missing.
      - run: python snapshot.py ../frontend/public/data
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run build:public
        working-directory: frontend
        env:
          CI: "false" # existing lint warnings should not block publishing
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
